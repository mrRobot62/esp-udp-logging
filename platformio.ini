[env]
framework = arduino
monitor_speed = 115200
upload_speed = 460800
build_flags =
    -I include
    ;-----------------------------------------------
    ; Enable WiFi logging and set UDP target for logs
    ;-----------------------------------------------
    -DWIFI_LOGGING_ENABLE=1
    -DWIFI_LOGGING_UDP_IP=\"192.168.0.249\"
    -DWIFI_LOGGING_UDP_PORT=10514
    -DCSV_OUT=1

    ;-----------------------------------------------
    ; Logging levels to enable (uncomment as needed)
    ;-----------------------------------------------
    -DCLIENTINFO
    -DCLIENTDBG
    -DCLIENTWARN
    -DCLIENTERR
    -DCLIENTRAW

[env:esp32dev]
platform = espressif32
board = esp32dev

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1

; TCP variants retain the existing UDP environments and configuration.
[env:esp32dev-tcp]
extends = env:esp32dev
build_flags =
    ${env.build_flags}
    -DWIFI_LOGGING_USE_TCP=1
    -DTCP_CONNECT_MAX_ATTEMPTS=10
    -DAUTO_SERVER_CONNECT=0
    -DWIFI_LOGGING_TCP_HOST=\"192.168.0.170\"
    -DWIFI_LOGGING_TCP_PORT=10514

[env:esp32-s3-devkitc-1-tcp]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DWIFI_LOGGING_USE_TCP=1
    -DTCP_CONNECT_MAX_ATTEMPTS=10
    -DAUTO_SERVER_CONNECT=0
    -DWIFI_LOGGING_TCP_HOST=\"192.168.0.170\"
    -DWIFI_LOGGING_TCP_PORT=10514

; Auto-discovery variants need no fixed TCP destination.
[env:esp32dev-tcp-auto]
extends = env:esp32dev
build_flags =
    ${env.build_flags}
    -DWIFI_LOGGING_USE_TCP=1
    -DTCP_CONNECT_MAX_ATTEMPTS=10
    -DAUTO_SERVER_CONNECT=1
    -DWIFI_LOGGING_DISCOVERY_PORT=10515

[env:esp32-s3-devkitc-1-tcp-auto]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env.build_flags}
    -DWIFI_LOGGING_USE_TCP=1
    -DTCP_CONNECT_MAX_ATTEMPTS=10
    -DAUTO_SERVER_CONNECT=1
    -DWIFI_LOGGING_DISCOVERY_PORT=10515
